[build]
base = "frontend"
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/api/*"
to = "https://leadpilotai-675e.onrender.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/health"
to = "https://leadpilotai-675e.onrender.com/health"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
